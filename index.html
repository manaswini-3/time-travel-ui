<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time Travel UI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="modern">

<div class="container">
  <h1>⏳ Time Travel UI</h1>

  <p class="intro">
    Just trying to imagine how the web felt... and how weird it might become.
  </p>

  <input type="range" min="1990" max="2050" value="2025" id="slider">
  <p id="yearDisplay">Year: 2025</p>

  <div class="card">
    <p id="content">This is normal web I guess.</p>
    <p id="glitchText"></p>
  </div>

  <button id="soundBtn">🔊 toggle sound</button>

  <h3>Travel log (kinda messy)</h3>
  <ul id="log"></ul>

</div>

<script src="script.js"></script>
</body>
</html>
